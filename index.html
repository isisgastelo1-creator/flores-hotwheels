<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de los Carritos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030712;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        /* Título Superior Estilo Hot Wheels */
        .titulo {
            text-align: center;
            color: #fbbf24;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6), 3px 3px 0px #dc2626;
            margin-bottom: 5px;
            animation: flotar 3s ease-in-out infinite;
            z-index: 10;
        }
        .subtitulo {
            color: #f3f4f6;
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 40px;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            z-index: 10;
        }
        /* Contenedor del Ramo */
        .ramo {
            position: relative;
            width: 320px;
            height: 380px;
            display: flex;
            justify-content: center;
        }
        /* Hojas y Tallos Verdes */
        .tallos {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 220px;
            background: linear-gradient(transparent, #064e3b 80%);
            clip-path: polygon(40% 100%, 60% 100%, 55% 0%, 45% 0%);
            opacity: 0.8;
        }
        .hoja {
            position: absolute;
            background: linear-gradient(135deg, #059669, #047857);
            border-radius: 0 100% 0 100%;
            transform-origin: bottom left;
            opacity: 0.9;
        }
        .h1 { width: 45px; height: 25px; bottom: 80px; left: 80px; transform: rotate(-30deg); }
        .h2 { width: 50px; height: 28px; bottom: 110px; right: 70px; transform: rotate(45deg) scaleX(-1); }
        .h3 { width: 40px; height: 22px; bottom: 140px; left: 100px; transform: rotate(-15deg); }
        /* Flores Individuales */
        .flor {
            position: absolute;
            width: 100px;
            height: 100px;
            animation: balanceo 4s ease-in-out infinite alternate;
        }
        /* Posiciones en forma de ramo */
        .f-izq   { top: 50px; left: 10px; animation-delay: 0.2s; }
        .f-medio { top: 0px; left: 110px; animation-delay: 0.7s; }
        .f-der   { top: 60px; right: 10px; animation-delay: 0.5s; }
        .f-sup   { top: -40px; left: 60px; animation-delay: 0s; }
        .f-sup2  { top: -30px; left: 160px; animation-delay: 0.9s; }

        /* Pétalos Azules de Neón */
        .petalos-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .petalo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 35px;
            height: 75px;
            background: linear-gradient(#38bdf8, #0284c7);
            border-radius: 50%;
            transform-origin: top center;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        /* Distribución circular de pétalos */
        .p1  { transform: translate(-50%, -50%) rotate(0deg); }
        .p2  { transform: translate(-50%, -50%) rotate(30deg); }
        .p3  { transform: translate(-50%, -50%) rotate(60deg); }
        .p4  { transform: translate(-50%, -50%) rotate(90deg); }
        .p5  { transform: translate(-50%, -50%) rotate(120deg); }
        .p6  { transform: translate(-50%, -50%) rotate(150deg); }
        .p7  { transform: translate(-50%, -50%) rotate(180deg); }
        .p8  { transform: translate(-50%, -50%) rotate(210deg); }
        .p9  { transform: translate(-50%, -50%) rotate(240deg); }
        .p10 { transform: translate(-50%, -50%) rotate(270deg); }
        .p11 { transform: translate(-50%, -50%) rotate(300deg); }
        .p12 { transform: translate(-50%, -50%) rotate(330deg); }

        /* Centro de la Flor (Círculo de Carrito/Frase) */
        .centro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 42px;
            height: 42px;
            background: linear-gradient(#b45309, #78350f);
            border: 2px solid #f59e0b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            z-index: 5;
        }
        /* Estrellas de fondo de adorno */
        .estrella {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: parpadeo 2s infinite alternate;
        }
        /* Animaciones */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes balanceo {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        @keyframes parpadeo {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Fondos de Estrellitas -->
    <div class="estrella" style="top:15%; left:20%; width:3px; height:3px; animation-delay:0.3s;"></div>
    <div class="estrella" style="top:25%; left:75%; width:4px; height:4px; animation-delay:0.8s;"></div>
    <div class="estrella" style="top:45%; left:10%; width:2px; height:2px; animation-delay:1.2s;"></div>
    <div class="estrella" style="top:10%; left:85%; width:3px; height:3px; animation-delay:0.1s;"></div>

    <!-- Mensajes de Encabezado -->
    <h1 class="titulo">Feliz Día De Los Carritos Hot Wheels</h1>
    <p class="subtitulo">Con Todo Mi Amor Para Ti</p>

    <!-- Estructura del Ramo -->
    <div class="ramo">
        <div class="tallos"></div>
        <div class="hoja h1"></div>
        <div class="hoja h2"></div>
        <div class="hoja h3"></div>

        <!-- Flor 1: T -->
        <div class="flor f-sup">
            <div class="petalos-container">
                <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
            </div>
            <div class="centro">T</div>
        </div>

        <!-- Flor 2: E -->
        <div class="flor f-sup2">
            <div class="petalos-container">
                <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
            </div>
            <div class="centro">E</div>
        </div>

        <!-- Flor 3: A -->
        <div class="flor f-izq">
            <div class="petalos-container">
                <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
            </div>
            <div class="centro">A</div>
        </div>

        <!-- Flor 4: M -->
        <div class="flor f-medio">
            <div class="petalos-container">
                <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
            </div>
            <div class="centro">M</div>
        </div>

        <!-- Flor 5: O -->
        <div class="flor f-der">
            <div class="petalos-container">
                <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
                <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
                <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
                <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
            </div>
            <div class="centro">O</div>
        </div>
    </div>

</body>
</html>
